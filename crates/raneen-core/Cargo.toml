[package]
name = "raneen-core"
version = "0.1.0"
edition = "2021"
description = "The Raneen core: audio in, text out. Speaks the newline-JSON helper protocol (see protocol/README.md)."

[dependencies]
# whisper.cpp bindings. Pulls and builds whisper.cpp from source, so the
# first build is minutes and later ones are seconds.
#
# **0.16 or newer, and the reason is portability rather than features.** Its
# build script forwards `GGML_*` environment variables to CMake; 0.14's
# forwards only `WHISPER_*` and `CMAKE_*`. Without `GGML_NATIVE=OFF` reaching
# ggml, the build tunes itself to whatever CPU compiled it — see
# `apps/Raneen/Makefile` and docs/RELEASING.md for why that ships a binary
# that crashes on older Macs.
whisper-rs = "0.16"
serde_json = "1"
# WAV parsing, for `bench` only. Pure Rust, no C, ~1k lines.
hound = "3"
libc = "0.2"
silero-vad-crs = { version = "0.4", features = ["auto"] }
ureq = "3.4.0"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
zmq = "0.10.0"
# Wake word. Pure Rust, compiles in — see src/hotword/mod.rs for why
# this rather than ONNX Runtime.
tract-onnx = "0.21"
# Speaker identification: the 80-dim Kaldi fbank CAM++ takes. A pure-Rust
# port — realfft and thiserror, no cmake and no bindgen. Deliberately NOT
# `knf-rs`, which vendors C++ and needs libclang at build time.
kaldi-native-fbank = "0.1"

[profile.release]
# The bundle-size half of the story: LTO plus one codegen unit lets the
# linker drop everything whisper.cpp exports that we never call.
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal on Apple Silicon: a system framework, so it adds no dylib to the
# bundle, no download and no runtime probe. It is what makes the larger
# models in the settings picker a real choice rather than a trap — on CPU
# `large-v3` runs slower than realtime.
#
# **The version must match `[dependencies]` above.** Cargo merges these two
# entries, and `whisper-rs-sys` declares `links = "whisper"`, so two versions
# in one graph is a resolver error rather than two builds.
whisper-rs = { version = "0.16", features = ["metal"] }
