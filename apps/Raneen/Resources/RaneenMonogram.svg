<!--
  Raneen monogram — the R from the brand mark, on its own.

  DERIVED, not hand-drawn: it reuses the exact path data from
  raneen_mobile.svg and simply windows it with a viewBox. Nothing is
  redrawn, so it can never drift from the master artwork, and it stays
  vector so it renders crisply at any size.

  It exists because the menu bar has room for roughly one icon width.
  The full mark is 2.85:1 — about three icon widths at 18pt — while this
  is essentially square. If the master mark is ever redrawn, regenerate
  rather than edit: scripts/make_monogram.py.
-->
