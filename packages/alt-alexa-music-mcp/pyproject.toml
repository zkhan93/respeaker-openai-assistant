[project]
name = "alt-alexa-music-mcp"
version = "0.1.0"
description = "Music MCP server: Navidrome + YouTube fallback, mpv playback, FastMCP HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "rapidfuzz>=3.9.0",
    "yt-dlp>=2024.10.0",
]

[project.scripts]
alt-alexa-music-mcp = "alt_alexa_music_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alt_alexa_music_mcp"]
