[project]
name = "voice-assistant"
version = "0.1.0"
description = "ReSpeaker 4-Mic Array audio core: capture, hotword/VAD detection, ZMQ broadcast, LED driver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gpiozero>=2.0.1",
    "numpy>=1.24.0,<2.0.0",
    "openai>=2.14.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "pyzmq>=26.0.0",
    "rpi-gpio>=0.7.1",
    "scipy>=1.13.1",
    "setuptools>=80.9.0",
    "soxr>=1.0.0",
    "spidev>=3.8",
    "typer[all]>=0.15.0",
    "webrtcvad>=2.0.10",
    "websockets>=15.0.1",
]

[project.scripts]
voice-assistant = "voice_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]
