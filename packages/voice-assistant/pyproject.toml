[project]
name = "voice-assistant"
version = "0.1.0"
description = "Raspberry Pi voice assistant app: ReSpeaker capture adapter, APA102 LED ring, ZMQ broadcast, music ducking"
readme = "README.md"
requires-python = ">=3.11"

# This package is now the **Pi composition root**, not the whole system.
# Everything platform-agnostic (buses, VAD, conversation state machine,
# STT/TTS engines) lives in `voice-core`; what remains here is the Pi's
# adapters plus the CLI that wires them together. See docs/ROADMAP.md AD-3.
dependencies = [
    # The Pi build ships every engine backend, so it takes all the extras.
    "voice-core[whisper,piper,openai,hotword,agent]",
    "langchain-mcp-adapters>=0.2.2",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "pyzmq>=26.0.0",
    "scipy>=1.13.1",
    "setuptools>=80.9.0",
    "soxr>=1.0.0",
    "typer>=0.15.0",
    "websockets>=15.0.1",
    # Pi-only deps. PEP 508 markers keep `uv sync` working on macOS / WSL
    # dev boxes; on Linux/Pi they install normally. `pyaudio` needs the
    # portaudio system lib (no prebuilt wheels on macOS arm64), and
    # `gpiozero` / `rpi-gpio` / `spidev` only build against Linux kernel
    # headers. The desktop app deliberately does NOT use pyaudio — see
    # `voice-desktop`, which uses sounddevice instead.
    "gpiozero>=2.0.1 ; sys_platform == 'linux'",
    "pyaudio>=0.2.14 ; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1 ; sys_platform == 'linux'",
    "spidev>=3.8 ; sys_platform == 'linux'",
]

[tool.uv.sources]
voice-core = { workspace = true }

# Optional runtime dependency: `systemd-python` enables a structured
# JournalHandler in voice_assistant.logging_config. It is intentionally NOT
# declared here because (a) it is source-only (no wheels) and would force a
# libsystemd-dev build on every dev machine, and (b) the fallback path
# (sd-daemon "<priority>" stderr prefixes) already produces correctly
# prioritised journal entries. To enable the richer backend on the Pi:
#
#     sudo apt-get install -y libsystemd-dev pkg-config
#     uv pip install systemd-python

[project.scripts]
voice-assistant = "voice_assistant.cli:main"

[dependency-groups]
# Dev-only tooling. Installed by `uv run` / `uv sync` but never shipped
# in the wheel. Run the suite with `uv run pytest` from this directory.
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]
