name: Tests

# Runs the unit suites on every push to main and on PRs targeting main
# (so breakage is caught before it lands).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # voice-core carries the domain logic, so it gets the real dependency
  # install: its base deps are tiny (numpy + webrtcvad-wheels, both with
  # prebuilt wheels) and the boundary tests in tests/test_boundaries.py
  # need a genuinely importable package to make their assertions mean
  # anything. Optional extras (whisper/piper/openai/hotword/agent) are
  # deliberately NOT installed — that is exactly what those tests check.
  voice-core:
    name: voice-core unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voice-core
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtualenv (Python 3.11)
        run: uv venv .venv --python 3.11

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python pytest
          uv pip install --python .venv/bin/python -e .

      # The end-to-end speech test is skipped unless VOICE_E2E=1: it needs
      # the whisper + piper extras and network access for model weights.
      - name: Run tests
        run: .venv/bin/python -m pytest

  # The Pi app installs WITHOUT its runtime deps (--no-deps): they include
  # native Pi-only libraries (pyaudio needs the portaudio system lib;
  # rpi-gpio / spidev build against Linux/Pi headers) plus the heavy
  # LLM/ASR stack. The remaining tests here cover the APA102 driver, which
  # injects its own fake SPI device, and conftest.py stubs pyaudio.
  voice-assistant:
    name: voice-assistant unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voice-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtualenv (Python 3.11)
        run: uv venv .venv --python 3.11

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python pytest
          uv pip install --python .venv/bin/python -e ../voice-core
          uv pip install --python .venv/bin/python -e . --no-deps

      - name: Run tests
        run: .venv/bin/python -m pytest

  # The desktop suite is structural only — it asserts the sounddevice
  # adapters still match the voice-core audio ports and never opens a
  # device, so it runs fine on a CI box with no audio hardware.
  #
  # **sounddevice's Linux wheel does not bundle PortAudio** — only the
  # macOS and Windows wheels do — so importing it raises `PortAudio library
  # not found` at collection time and every test file errors before a
  # single assertion runs. The system library is enough: nothing here
  # opens a device, it only has to be loadable.
  voice-desktop:
    name: voice-desktop unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/voice-desktop
    steps:
      - uses: actions/checkout@v4

      # xvfb because pynput chooses its backend at import time and on Linux
      # that is X11: with no display, `pynput.keyboard` cannot be imported
      # and the keyboard-sink and hotkey tests fail at import. Its `dummy`
      # backend was tried first and rejected — it defines a single key, so
      # `test_real_key_names_are_accepted` would report every real key
      # name as unknown. A virtual display costs ten seconds and lets the
      # tests run against the same backend a Linux user gets.
      - name: Install PortAudio and a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q libportaudio2 xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create virtualenv (Python 3.11)
        run: uv venv .venv --python 3.11

      # --no-deps on the package itself skips the whisper/piper extras that
      # voice-core[...] would pull in, so the package's own light
      # dependencies are named here instead: sounddevice for the port
      # tests, typer because the CLI fitness tests import and spawn
      # `cli.py`, and pynput because the keyboard-sink tests exercise the
      # paste path, which imports `pynput.keyboard` even with the fake
      # controller in place.
      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python pytest sounddevice typer pynput
          uv pip install --python .venv/bin/python -e ../voice-core
          uv pip install --python .venv/bin/python -e . --no-deps

      # Under the virtual display, so pynput's X11 backend has something to
      # connect to. `-a` picks a free display number.
      - name: Run tests
        run: xvfb-run -a .venv/bin/python -m pytest

  # The Rust core. Unit tests are pure and hermetic — bus, VAD state
  # machine, tail padding, hallucination markers — and need no model and
  # no audio hardware, so they run on any runner.
  #
  # whisper.cpp and the Silero C port are both built from source, so the
  # first run is minutes. The cache keys on Cargo.lock, which is why that
  # file is committed.
  raneen-core:
    name: raneen-core unit tests (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/raneen-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/raneen-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/raneen-core/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Tests
        run: cargo test --release

  # Conformance: the protocol suite driven against the Rust helper.
  #
  # This is the anti-drift check. It is NOT a duplicate of the unit tests
  # — it spawns a real helper, streams real audio over a real socket, and
  # asserts on transcripts. Every case here pins a behaviour that a real
  # bug has broken at least once (last-word truncation, VAD segmentation,
  # false triggers on non-speech).
  #
  # Downloads a 57 MB model, so it is cached on the model filename.
  conformance:
    name: protocol conformance (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/raneen-core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/raneen-core/Cargo.lock') }}

      - name: Cache whisper model
        id: model
        uses: actions/cache@v4
        with:
          path: ~/.cache/raneen/models
          key: ggml-base.en-q5_1

      - name: Download model
        if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/raneen/models
          curl -sL -o ~/.cache/raneen/models/ggml-base.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin

      # ~3.5 MB of ONNX, cached on the fetch script so a change to which
      # models it pulls invalidates it.
      - name: Cache wake-word models
        id: wakeword
        uses: actions/cache@v4
        with:
          path: ~/.cache/raneen/wakeword
          key: wakeword-${{ hashFiles('tools/fetch-wakeword-models.sh') }}

      # Without these the two wake-word cases skip, and a skipped case is
      # not a passing one. CI was running 7 of 11 and reporting success.
      - name: Fetch wake-word models
        if: steps.wakeword.outputs.cache-hit != 'true'
        run: ./tools/fetch-wakeword-models.sh

      # 29 MB of ONNX for the speaker cases. Without it the speaker group
      # skips, and under strict mode that is a failure — which is exactly
      # what happened for three weeks after the group was added: the suite
      # printed "11 passed, 4 SKIPPED" and the job went red for want of a
      # download step nobody had written.
      - name: Cache speaker model
        id: speaker
        uses: actions/cache@v4
        with:
          path: ~/.cache/raneen/speaker
          key: speaker-${{ hashFiles('tools/fetch-speaker-models.sh') }}

      - name: Fetch speaker model
        if: steps.speaker.outputs.cache-hit != 'true'
        run: ./tools/fetch-speaker-models.sh

      # Same reasoning: the two cases that cover always-on recording and
      # concurrent dictation need a Python that can import zmq.
      # `--break-system-packages` because the runner's python3 is marked
      # externally managed, and a plain `--user` install fails on it. The
      # suite finds this via the user site directory, which is on sys.path.
      - name: Install pyzmq
        run: python3 -m pip install --user --break-system-packages pyzmq

      - name: Build helper
        run: cargo build --release --manifest-path crates/raneen-core/Cargo.toml

      # Strict: on a runner where every optional dependency is installed
      # deliberately, a skip means the installation broke rather than that a
      # tool is absent.
      - name: Run conformance suite
        env:
          RANEEN_SUITE_STRICT: "1"
        run: ./protocol/run-suite.sh rust

  # The Swift shell. 145 tests that had never run in CI — the socket
  # transport, the argv the core is launched with, the trigger-key rules,
  # the meter and the text sink.
  #
  # **macOS 15 because the runner must be Apple Silicon.** aarch64 mandates
  # NEON, which is why one build covers every Apple Silicon Mac and every
  # Pi 4/5; an Intel runner would build something we do not ship. This job
  # deliberately does not sign, so it needs no secrets and runs on forks —
  # signing belongs to release.yml.
  raneen-app:
    name: Raneen app unit tests (Swift)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/Raneen
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Tests
        run: swift test

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `protocol/` and `tools/` are included because they were not, and drifted:
      # an unused import and two over-long lines sat in the conformance harness
      # for weeks. That harness is the thing guarding against drift between two
      # implementations, so leaving it unlinted was the wrong file to skip.
      #
      # `examples/` is deliberately still out. It carries real violations, and
      # its audience is someone consuming the ZeroMQ wire format rather than
      # working on the core — fixing it is a separate change, not a drive-by.
      - name: Lint
        run: uvx ruff check packages/ protocol/ tools/

      # Format-checked for `packages/` only: `protocol/` and `tools/` are
      # scripts written to be read as prose, and `ruff format` would reflow
      # argument lists and comment blocks that are laid out deliberately.
      - name: Format check
        run: uvx ruff format --check packages/
